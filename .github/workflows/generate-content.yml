name: 블로그 글 수동 발행

# 자동 스케줄 없음 — Actions 탭에서 "Run workflow" 를 눌렀을 때만 실행됩니다.
on:
  workflow_dispatch:
    inputs:
      per_category:
        description: '카테고리당 생성할 글 개수 (auto일 때는 8개 카테고리 전부에 각각 적용됨)'
        required: false
        default: '3'
      category:
        description: '카테고리 (auto = 8개 전체 메뉴에 위 개수만큼씩 생성)'
        required: false
        default: 'auto'
        type: choice
        options:
          - auto
          - cost
          - food
          - storage
          - cleaning
          - safety
          - housing
          - products
          - lifestyle

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: 글 자동 생성 (주제는 topics.json 에서 자동 선택)
        run: npx ts-node --project tsconfig.scripts.json scripts/generate-post.ts "${{ github.event.inputs.per_category || '3' }}" "${{ github.event.inputs.category || 'auto' }}"
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: 커밋 & 푸시 (여기서 실제로 블로그에 발행됨)
        run: |
          git config --global user.name 'AI Blog Bot'
          git config --global user.email 'bot@blog.com'
          git add content/blog/ content/topics.json
          # IndexNow에 새 글 URL만 제출하기 위해, 커밋 전에 새로 추가된 .mdx slug만 뽑아둔다.
          git diff --staged --name-only --diff-filter=A -- 'content/blog/*.mdx' \
            | sed -E 's#^content/blog/(.*)\.mdx$#\1#' > /tmp/new_slugs.txt
          git diff --staged --quiet || git commit -m "feat: 1인 가구 블로그 글 자동 발행 - $(date +'%Y-%m-%d %H:%M')"
          git push

      - name: IndexNow에 새 글 URL 제출 (네이버, 즉시 발견용)
        # INDEXNOW_KEY 시크릿을 아직 설정하지 않았다면 스크립트가 조용히
        # 건너뛴다 — 이 단계가 있다고 발행이 실패하지 않는다.
        run: node scripts/submit-indexnow.mjs $(cat /tmp/new_slugs.txt)
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
          NEXT_PUBLIC_SITE_URL: https://honsamnote.co.kr
